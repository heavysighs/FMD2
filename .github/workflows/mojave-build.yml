name: Mojave Build (FMD2)

# Builds FMD2 for macOS 10.14 Mojave (Intel x86_64) with the Lazarus/FPC
# Cocoa widgetset. The branch is upstream master @ 9c8020d7 (2026-10-15)
# plus the Linux port's cross-platform changes, plus a Darwin build mode
# in mangadownloader/md.lpi that targets darwin/x86_64 with -WM10.14.
# Toolchain: FPC 3.2.4rc1a + Lazarus 4.6 official macOS packages (LCL 4.6
# satisfies md.lpi's LCL >= 3.8 requirement).

on:
  push:
    branches:
      - mojave-fix
  workflow_dispatch:

jobs:
  build:
    name: Build FMD2 (Darwin/Cocoa)
    runs-on: macos-15-intel
    steps:
      - name: Checkout mojave-fix
        uses: actions/checkout@v4
        with:
          ref: mojave-fix

      - name: Install FPC + Lazarus 4.6 (official SourceForge packages)
        # md.lpi requires LCL >= 3.8, so Homebrew's stale 3.6 cask and the
        # (now deleted) gcarq/setup-lazarus action are both out. Lazarus 4.6
        # ships as: an FPC dmg (compiler) + a Lazarus zip (IDE + FPC sources).
        run: |
          set -e
          BASE='https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.6'
          curl -fL -o /tmp/fpc.dmg "$BASE/fpc-3.2.4rc1a.intelarm64-macosx.dmg/download"
          curl -fL -o /tmp/lazarus.zip "$BASE/lazarus-darwin-x86_64-4.6.zip/download"
          mnt=$(mktemp -d)
          hdiutil attach /tmp/fpc.dmg -mountpoint "$mnt" -nobrowse
          pkg=$(find "$mnt" -name '*.pkg' -o -name '*.mpkg' | head -1)
          echo "FPC installer package: $pkg"
          sudo installer -pkg "$pkg" -target /
          hdiutil detach "$mnt"
          mkdir -p "$HOME/lazarus-dist"
          unzip -q /tmp/lazarus.zip -d "$HOME/lazarus-dist"
          fpc -iV
          find "$HOME/lazarus-dist" -name lazbuild -type f | head -3

      - name: Install native libraries
        run: brew install openssl@3 sqlite webp brotli zstd pcre2 duktape lua sevenzip

      - name: Locate lazbuild
        run: |
          LAZBIN=$(command -v lazbuild || find /Applications "$HOME" -name lazbuild -type f 2>/dev/null | head -1)
          echo "lazbuild: $LAZBIN"
          "$LAZBIN" --version || true
          echo "LAZBIN=$LAZBIN" >> "$GITHUB_ENV"
          echo "LAZARUSDIR=$(dirname "$LAZBIN")" >> "$GITHUB_ENV"

      - name: Fetch and build Lazarus packages (Cocoa)
        env:
          WIDGETSET: cocoa
        run: ./scripts/build-deps.sh

      - name: Build FMD2 (Darwin mode)
        run: |
          "$LAZBIN" --lazarusdir="$LAZARUSDIR" --build-mode=Darwin --widgetset=cocoa mangadownloader/md.lpi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fmd2-darwin-x86_64
          path: bin/x86_64-darwin/
          retention-days: 30
