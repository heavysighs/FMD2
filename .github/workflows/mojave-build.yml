name: Mojave Build (FMD2)

# Builds FMD2 for macOS 10.14 Mojave (Intel x86_64) with the Lazarus/FPC
# Cocoa widgetset. The branch is upstream master @ 9c8020d7 (2026-10-15)
# plus the Linux port's cross-platform changes, plus a Darwin build mode
# in mangadownloader/md.lpi that targets darwin/x86_64 with -WM10.14.
# Toolchain: FPC 3.2.4rc1a + Lazarus 4.6 official macOS packages (LCL 4.6
# satisfies md.lpi's LCL >= 3.8 requirement).

on:
  push:
    branches:
      - mojave-fix
  workflow_dispatch:

jobs:
  build:
    name: Build FMD2 (Darwin/Cocoa)
    runs-on: macos-15-intel
    steps:
      - name: Checkout mojave-fix
        uses: actions/checkout@v4
        with:
          ref: mojave-fix

      - name: Install FPC + Lazarus 4.6 (official SourceForge packages)
        # md.lpi requires LCL >= 3.8, so Homebrew's stale 3.6 cask and the
        # (now deleted) gcarq/setup-lazarus action are both out. Lazarus 4.6
        # ships as: an FPC dmg (compiler) + a Lazarus zip (IDE + FPC sources).
        run: |
          set -e
          BASE='https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.6'
          # SourceForge mirrors can crawl or drop mid-file (run #19 died
          # after an hour at ~60 KB/s): resume partial downloads, abort
          # stalls so retries kick in, wipe the partial every 3rd failure
          # in case a mirror cannot resume.
          dl() {
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fL -C - --speed-limit 20480 --speed-time 60 -o "$2" "$1"; then return 0; fi
              echo "download attempt $i failed for $1"
              if [ $((i % 3)) -eq 0 ]; then rm -f "$2"; fi
              sleep 5
            done
            echo "download failed: $1"; return 1
          }
          dl "$BASE/fpc-3.2.4rc1a.intelarm64-macosx.dmg/download" /tmp/fpc.dmg
          dl "$BASE/lazarus-darwin-x86_64-4.6.zip/download" /tmp/lazarus.zip
          mnt=$(mktemp -d)
          hdiutil attach /tmp/fpc.dmg -mountpoint "$mnt" -nobrowse
          pkg=$(find "$mnt" -name '*.pkg' -o -name '*.mpkg' | head -1)
          echo "FPC installer package: $pkg"
          sudo installer -pkg "$pkg" -target /
          hdiutil detach "$mnt"
          mkdir -p "$HOME/lazarus-dist"
          unzip -q /tmp/lazarus.zip -d "$HOME/lazarus-dist"
          fpc -iV
          find "$HOME/lazarus-dist" -name lazbuild -type f | head -3

      - name: Install native libraries
        # No lua here: the app binds Lua 5.3 (lua53.pas), Homebrew only
        # carries 5.4 now, so 5.3.6 is built from source in the next step.
        run: brew install openssl@3 sqlite webp brotli zstd pcre2 duktape sevenzip

      - name: Build Lua 5.3.6 dylib (targeting 10.14)
        run: |
          set -e
          curl -fsSL -o /tmp/lua-5.3.6.tar.gz https://www.lua.org/ftp/lua-5.3.6.tar.gz
          tar -xzf /tmp/lua-5.3.6.tar.gz -C /tmp
          cd /tmp/lua-5.3.6
          make macosx MACOSX_DEPLOYMENT_TARGET=10.14
          cd src
          cc -dynamiclib -mmacosx-version-min=10.14 \
             -Wl,-all_load -Wl,-install_name,liblua5.3.dylib \
             -o liblua5.3.dylib liblua.a -lm -ldl
          sudo cp liblua5.3.dylib /usr/local/lib/
          ls -l /usr/local/lib/liblua5.3.dylib

      - name: Locate lazbuild
        run: |
          LAZBIN=$(command -v lazbuild || find /Applications "$HOME" -name lazbuild -type f 2>/dev/null | head -1)
          echo "lazbuild: $LAZBIN"
          "$LAZBIN" --version || true
          echo "LAZBIN=$LAZBIN" >> "$GITHUB_ENV"
          echo "LAZARUSDIR=$(dirname "$LAZBIN")" >> "$GITHUB_ENV"
          echo "$(dirname "$LAZBIN")" >> "$GITHUB_PATH"

      - name: Fetch and build Lazarus packages (Cocoa)
        env:
          WIDGETSET: cocoa
        run: ./scripts/build-deps.sh

      - name: Build FMD2 (Darwin mode)
        run: |
          "$LAZBIN" --lazarusdir="$LAZARUSDIR" --build-mode=Darwin --widgetset=cocoa mangadownloader/md.lpi

      - name: Build Mojave dylibs (OpenSSL, Duktape, PCRE2, Brotli, Zstd, WebP)
        # The Homebrew bottles of these are built for macOS 15 and refuse
        # to load on Mojave, so the copies bundled into the app are built
        # from source with a 10.14 deployment target (Lua 5.3.6 above is
        # already built the same way).
        run: |
          set -e
          export MACOSX_DEPLOYMENT_TARGET=10.14
          mkdir -p "$HOME/mojave-libs"
          curl -fL -o /tmp/openssl.tar.gz https://www.openssl.org/source/openssl-3.0.18.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.0.18
          ./Configure darwin64-x86_64-cc shared no-tests --prefix=/tmp/openssl-stage -mmacosx-version-min=10.14
          make -j"$(sysctl -n hw.ncpu)" build_libs
          cp -a libcrypto.3.dylib libssl.3.dylib "$HOME/mojave-libs/"
          cd "$GITHUB_WORKSPACE"
          curl -fL -o /tmp/duktape.tar.xz https://duktape.org/duktape-2.7.0.tar.xz
          tar -xJf /tmp/duktape.tar.xz -C /tmp
          cc -O2 -fPIC -mmacosx-version-min=10.14 -dynamiclib \
             -Wl,-install_name,@rpath/libduktape.dylib \
             -o "$HOME/mojave-libs/libduktape.dylib" /tmp/duktape-2.7.0/src/duktape.c -lm
          curl -fL -o /tmp/pcre2.tar.gz https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.45/pcre2-10.45.tar.gz
          tar -xzf /tmp/pcre2.tar.gz -C /tmp
          cd /tmp/pcre2-10.45
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
                -DPCRE2_BUILD_PCRE2_8=ON -DPCRE2_BUILD_PCRE2_16=OFF -DPCRE2_BUILD_PCRE2_32=OFF \
                -DPCRE2_SUPPORT_JIT=OFF -DPCRE2_SUPPORT_LIBZ=OFF -DPCRE2_SUPPORT_LIBBZ2=OFF \
                -DPCRE2_SUPPORT_LIBREADLINE=OFF -DPCRE2_BUILD_TESTS=OFF \
                -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cp -aL build/libpcre2-8.0.dylib "$HOME/mojave-libs/libpcre2-8.dylib"
          cd "$GITHUB_WORKSPACE"
          # Runtime-loaded (dlopen) codec libraries: webp.pas, BrotliDec.pas
          # and ZstdDec.pas load these by leaf name at startup.
          curl -fL -o /tmp/brotli.tar.gz https://github.com/google/brotli/archive/refs/tags/v1.1.0.tar.gz
          tar -xzf /tmp/brotli.tar.gz -C /tmp
          cd /tmp/brotli-1.1.0
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
                -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF -DBROTLI_BUILD_TOOLS=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cp -aL build/libbrotlidec.dylib "$HOME/mojave-libs/libbrotlidec.dylib"
          cp -aL build/libbrotlicommon.dylib "$HOME/mojave-libs/libbrotlicommon.dylib"
          curl -fL -o /tmp/zstd.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz
          tar -xzf /tmp/zstd.tar.gz -C /tmp
          cd /tmp/zstd-1.5.6
          cmake -S build/cmake -B build/builddir -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
                -DZSTD_BUILD_SHARED=ON -DZSTD_BUILD_STATIC=OFF \
                -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF
          cmake --build build/builddir -j"$(sysctl -n hw.ncpu)"
          cp -aL build/builddir/lib/libzstd.dylib "$HOME/mojave-libs/libzstd.dylib"
          curl -fL -o /tmp/libwebp.tar.gz https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.5.0.tar.gz
          tar -xzf /tmp/libwebp.tar.gz -C /tmp
          cd /tmp/libwebp-1.5.0
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 -DBUILD_SHARED_LIBS=ON \
                -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF \
                -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF \
                -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cp -aL build/libwebp.dylib "$HOME/mojave-libs/libwebp.dylib"
          cp -aL build/libsharpyuv.dylib "$HOME/mojave-libs/libsharpyuv.dylib"
          cd "$GITHUB_WORKSPACE"
          # 7zz console archiver: FMD2 extracts its website-module database
          # (.7z) and packs chapters with an external 7z, and a bare Mac has
          # none. The official prebuilt Mac 7zz declares min macOS 12.0, so
          # build it from source for 10.14 (same route Homebrew uses).
          curl -fL -o /tmp/7z-src.tar.xz https://www.7-zip.org/a/7z2501-src.tar.xz
          tar -xJf /tmp/7z-src.tar.xz -C /tmp
          # 7-Zip 25.01 prefers timespec_get(), which macOS only added in
          # 10.15; steer it to clock_gettime() (present since 10.12)
          sed -i.fmd2bak 's/defined(TIME_UTC) && !defined(__ANDROID__)/defined(TIME_UTC) \&\& !defined(__ANDROID__) \&\& !defined(ZIP7_NO_timespec_get)/' /tmp/CPP/Windows/TimeUtils.cpp
          grep -n 'ZIP7_NO_timespec_get' /tmp/CPP/Windows/TimeUtils.cpp
          cd /tmp/CPP/7zip/Bundles/Alone2
          make -j"$(sysctl -n hw.ncpu)" -f makefile.gcc \
               CC="clang -mmacosx-version-min=10.14 -DZIP7_NO_timespec_get" \
               CXX="clang++ -mmacosx-version-min=10.14 -DZIP7_NO_timespec_get"
          ZZBIN=$(find . -name 7zz -type f | head -1)
          echo "built 7zz: $ZZBIN"
          cp "$ZZBIN" "$HOME/mojave-libs/7zz"
          # CA bundle for TLS verification on macOS: a from-source OpenSSL
          # has no usable default CA paths there (see httpsendthread.pas)
          curl -fL -o "$HOME/mojave-libs/cacert.pem" https://curl.se/ca/cacert.pem
          ls -l "$HOME/mojave-libs/"

      - name: Package FMD2.app
        run: bash scripts/package-app.sh

      - name: Mojave gate
        run: |
          python3 -m venv /tmp/gate-venv
          /tmp/gate-venv/bin/pip install -q lief
          /tmp/gate-venv/bin/python .github/scripts/check-mojave.py FMD2.app
          /tmp/gate-venv/bin/python .github/scripts/check-runtime-names.py FMD2.app

      - name: Upload app
        run: ditto -c -k --sequesterRsrc --keepParent FMD2.app FMD2-mojave.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fmd2-mojave-app
          path: FMD2-mojave.zip
          retention-days: 30
